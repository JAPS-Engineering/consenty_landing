<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Consenty social preview (Open Graph, 1200x630).
       Mirrors the site's light hero: canvas surface, centered lockup, Inter Tight display,
       Inter body. Flat by contract — no shadows. Swoosh gradient copied from Wordmark.jsx
       ('dark' tone: indigo base, pink->transparent overlay). -->
