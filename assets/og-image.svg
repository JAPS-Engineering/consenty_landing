    <linearGradient id="accentbar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#FF79BA"/>
    </linearGradient>
    <linearGradient id="wash" x1="600" y1="630" x2="600" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF0FC"/>
      <stop offset="1" stop-color="#EEF0FC" stop-opacity="0"/>
    </linearGradient>
    <!-- Wordmark swoosh gradient, verbatim from components/core/Wordmark.jsx -->
    <linearGradient id="cg" x1="880.455" y1="28" x2="754.995" y2="107.573" gradientUnits="userSpaceOnUse">
      <stop offset="0.0480769" stop-color="#FF79BA"/>
      <stop offset="1" stop-color="#4338CA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect y="330" width="1200" height="300" fill="url(#wash)"/>
  <rect width="1200" height="8" fill="url(#accentbar)"/>

